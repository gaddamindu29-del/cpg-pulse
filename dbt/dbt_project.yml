name: cpg_pulse
version: "1.0.0"
config-version: 2

profile: cpg_pulse

model-paths: ["models"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
clean-targets: ["target", "dbt_packages"]

vars:
  # Configurable thresholds referenced by marts models -- kept here (not
  # hardcoded in SQL) so business users can retune them without a code change.
  # See docs/metrics.md for the business meaning of each.
  stockout_high_risk_days_of_supply: 3
  stockout_medium_risk_days_of_supply: 7
  excess_inventory_days_of_supply_threshold: 45
  max_reasonable_selling_price: 500
  promotion_baseline_lookback_weeks: 8

models:
  cpg_pulse:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
      dimensions:
        +materialized: table
      facts:
        +materialized: incremental
      analytics:
        +materialized: table
