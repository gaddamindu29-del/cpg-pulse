x-airflow-common: &airflow-common
  build:
    context: ./airflow
    dockerfile: Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${METADATA_DB_USER:-cpgpulse}:${METADATA_DB_PASSWORD:-cpgpulse_dev_password}@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:-cpgpulse_dev_airflow_secret}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    CPG_PULSE_ENV: local
    AWS_ENDPOINT_URL: http://minio:9000
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-cpgpulse}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-cpgpulse_dev_secret}
    METADATA_DB_HOST: postgres
    METADATA_DB_NAME: ${METADATA_DB_NAME:-cpg_pulse_metadata}
    METADATA_DB_USER: ${METADATA_DB_USER:-cpgpulse}
    METADATA_DB_PASSWORD: ${METADATA_DB_PASSWORD:-cpgpulse_dev_password}
    WAREHOUSE_DB_HOST: postgres
    WAREHOUSE_DB_NAME: ${WAREHOUSE_DB_NAME:-cpg_pulse_warehouse}
    WAREHOUSE_DB_USER: ${WAREHOUSE_DB_USER:-cpgpulse}
    WAREHOUSE_DB_PASSWORD: ${WAREHOUSE_DB_PASSWORD:-cpgpulse_dev_password}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/config:/opt/airflow/config
    - ./airflow/logs:/opt/airflow/logs
    - ./ingestion:/opt/airflow/repo/ingestion
    - ./spark:/opt/airflow/repo/spark
    - ./scripts:/opt/airflow/repo/scripts
    - ./dbt:/opt/airflow/repo/dbt
    - ./data:/opt/airflow/repo/data
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - cpg-pulse

services:
  postgres:
    image: postgres:16-alpine
    container_name: cpg-pulse-postgres
    environment:
      POSTGRES_USER: ${METADATA_DB_USER:-cpgpulse}
      POSTGRES_PASSWORD: ${METADATA_DB_PASSWORD:-cpgpulse_dev_password}
      POSTGRES_DB: ${METADATA_DB_NAME:-cpg_pulse_metadata}
    ports:
      # Host port is configurable (POSTGRES_HOST_PORT) so this doesn't collide
      # with a pre-existing local Postgres install on the default port --
      # a real conflict hit during local validation (see docs/runbook.md).
      # Service-to-service traffic inside the Docker network always uses
      # `postgres:5432` regardless of this value.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres-init:/docker-entrypoint-initdb.d
      - ./warehouse/postgres:/opt/warehouse-postgres:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${METADATA_DB_USER:-cpgpulse}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cpg-pulse

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: cpg-pulse-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-cpgpulse}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-cpgpulse_dev_secret}
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cpg-pulse

  minio-init:
    image: minio/mc:latest
    container_name: cpg-pulse-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${AWS_ACCESS_KEY_ID:-cpgpulse} ${AWS_SECRET_ACCESS_KEY:-cpgpulse_dev_secret} &&
      mc mb -p local/${S3_BUCKET_RAW:-cpg-pulse-raw} &&
      mc mb -p local/${S3_BUCKET_STANDARDIZED:-cpg-pulse-standardized} &&
      mc mb -p local/${S3_BUCKET_CURATED:-cpg-pulse-curated} &&
      mc mb -p local/${S3_BUCKET_QUARANTINE:-cpg-pulse-quarantine} &&
      echo 'MinIO buckets ready.'
      "
    networks:
      - cpg-pulse

  airflow-init:
    <<: *airflow-common
    container_name: cpg-pulse-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER:-admin}" \
          --password "${AIRFLOW_ADMIN_PASSWORD:-admin}" \
          --firstname CPG --lastname Pulse --role Admin \
          --email admin@example.com || true

  airflow-webserver:
    <<: *airflow-common
    container_name: cpg-pulse-airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      - airflow-init
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 10

  airflow-scheduler:
    <<: *airflow-common
    container_name: cpg-pulse-airflow-scheduler
    command: scheduler
    depends_on:
      - airflow-init

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: cpg-pulse-api
    environment:
      WAREHOUSE_DB_HOST: postgres
      WAREHOUSE_DB_NAME: ${WAREHOUSE_DB_NAME:-cpg_pulse_warehouse}
      WAREHOUSE_DB_USER: ${WAREHOUSE_DB_USER:-cpgpulse}
      WAREHOUSE_DB_PASSWORD: ${WAREHOUSE_DB_PASSWORD:-cpgpulse_dev_password}
      METADATA_DB_HOST: postgres
      METADATA_DB_NAME: ${METADATA_DB_NAME:-cpg_pulse_metadata}
      METADATA_DB_USER: ${METADATA_DB_USER:-cpgpulse}
      METADATA_DB_PASSWORD: ${METADATA_DB_PASSWORD:-cpgpulse_dev_password}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - cpg-pulse

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: cpg-pulse-dashboard
    environment:
      DASHBOARD_API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
    networks:
      - cpg-pulse

networks:
  cpg-pulse:
    name: cpg-pulse-network

volumes:
  pgdata:
  minio-data:
